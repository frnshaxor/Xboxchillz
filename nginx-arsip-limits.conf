# Rate-limit zones for Arsip Layar
# Only key on client IP when the request is ?page=login. Empty key = no limit applied.
map $arg_page $login_key {
    default "";
    login   $binary_remote_addr;
}
limit_req_zone $login_key          zone=login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
